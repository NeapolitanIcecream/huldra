name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Existing tagged version to publish, without the v prefix
        required: true
        type: string

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build tagged distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Verify the version and tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(uv version --short)"
          RUNTIME_VERSION="$(
            uv run python -c 'from huldra import __version__; print(__version__)'
          )"
          if [[ "${RUNTIME_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "Runtime version ${RUNTIME_VERSION} does not match package version ${PACKAGE_VERSION}" >&2
            exit 1
          fi
          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            EXPECTED_TAG="${RELEASE_TAG}"
          else
            EXPECTED_TAG="v${REQUESTED_VERSION}"
          fi
          if [[ "${EXPECTED_TAG}" != "v${PACKAGE_VERSION}" ]]; then
            echo "Expected ${EXPECTED_TAG} to match package version v${PACKAGE_VERSION}" >&2
            exit 1
          fi
          if [[ "$(git rev-list -n 1 "${EXPECTED_TAG}")" != "${GITHUB_SHA}" ]]; then
            echo "${EXPECTED_TAG} does not point at ${GITHUB_SHA}" >&2
            exit 1
          fi
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/huldra-arxiv/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
